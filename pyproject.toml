[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optiserve"
version = "0.1.0"
description = "End-to-End PyTorch Reasoning Distillation, Quantization Benchmarking, AirLLM Layer-Wise Streaming, and Speculative Decoding Engine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Hamza Hattab", email = "hhamzariadh@gmail.com"}
]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
    "bitsandbytes>=0.43.0",
    "safetensors>=0.4.3",
    "sentencepiece>=0.2.0",
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.4.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "rich>=13.7.0",
    "datasets>=2.20.0",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["optiserve*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
